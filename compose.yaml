# Homelab deployment for rotation-proxy-gateway.
# config.yaml is the Git-ignored credential-bearing runtime file at the repo
# root; copy config.example.yaml to config.yaml first. Hot reload polls file
# content, so editing config.yaml in place on the host applies without a
# restart. One caveat of the single-file bind mount: replacing the file
# atomically (mv, editor safe-save) splices in a new inode that the mount
# never follows — edit in place, or restart the container after a replace.
services:
  rpgw:
    build:
      context: .
      args:
        VERSION: 0.1.0-dev
    container_name: rpgw
    ports:
      - "30121:30121" # mixed IPv4/IPv6 egress forward proxy
      - "30122:30122" # IPv4-egress forward proxy
      - "30123:30123" # IPv6-egress forward proxy
      - "30120:30120" # admin: healthz and status
    environment:
      # Bootstrap-only settings: changes require a container restart.
      CONFIG_FILE: /app/config.yaml
      # Optional. The drain budget is shared by all listeners and must stay
      # below stop_grace_period so docker's SIGKILL never cuts it short.
      # SHUTDOWN_GRACE: 45s
    # docker stop sends SIGTERM and waits this long before SIGKILL. Keep it
    # above the gateway's SHUTDOWN_GRACE (default 55s) plus a little margin.
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "/app/rotation-proxy-gateway", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
