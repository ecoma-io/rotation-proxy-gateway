# Homelab deployment for rotation-proxy-gateway.
# config/config.yaml is the Git-ignored credential-bearing runtime file.
# Copy config.example.yaml into config/ first. The config directory is mounted
# read-only instead of the single file: a single-file bind mount pins the
# inode, so replacing the file on the host would be invisible to the watcher
# and hot reload would never fire.
services:
  rpgw:
    build:
      context: .
      args:
        VERSION: 0.1.0-dev
    container_name: rpgw
    ports:
      - "30121:30121" # mixed IPv4/IPv6 egress forward proxy
      - "30122:30122" # IPv4-egress forward proxy
      - "30123:30123" # IPv6-egress forward proxy
      - "30120:30120" # admin: healthz and status
    environment:
      # Bootstrap-only settings: changes require a container restart.
      CONFIG_FILE: /app/config/config.yaml
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "/app/rotation-proxy-gateway", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
