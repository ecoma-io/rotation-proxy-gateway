# Homelab deployment for rotation-proxy-gateway.
# config.yaml is a root-level, Git-ignored credential-bearing runtime file.
# Copy config.example.yaml first; it is mounted read-only and never baked into
# the image or committed.
services:
  rpgw:
    build:
      context: .
      args:
        VERSION: 0.1.0-dev
    container_name: rpgw
    ports:
      - "30121:30121" # mixed IPv4/IPv6 egress forward proxy
      - "30122:30122" # IPv4-egress forward proxy
      - "30123:30123" # IPv6-egress forward proxy
      - "30120:30120" # admin: healthz and status
    environment:
      # Bootstrap-only settings: changes require a container restart.
      CONFIG_FILE: /app/config.yaml
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "/app/rotation-proxy-gateway", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
