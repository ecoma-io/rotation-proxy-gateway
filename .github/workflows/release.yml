name: Release

# release-please owns the release pull request and the version tag (config in
# release-please-config.json; the current version lives in
# .release-please-manifest.json — neither is hand-edited). When a release
# actually lands — the release PR merged, the tag minted — the docker job
# publishes to ghcr.io/ecoma-io/rotation-proxy-gateway, at the version tag
# and, for a non-prerelease, `latest`. A prerelease never moves
# `latest`: the whole point of the floating tag is "the release a compose
# file should pull today", and an RC is not that.

on:
  push:
    branches: [main]

permissions: read-all

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  docker:
    name: docker
    needs: [prepare]
    # The green-lane tripwire: this job must ship exactly when prepare
    # minted a release, and never when it merely opened or updated the
    # release pull request — a "green lane that shipped nothing" is the
    # defect this gate exists to make impossible to miss.
    if: needs.prepare.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag list is computed in the shell — a `case` over the tag, not a
      # expression interpolated into the script (see
      # .github/semgrep/workflows.yaml) — and handed to the build step as a
      # step output. A prerelease (dash in the tag, per semver) gets the
      # version tag only; anything else also moves `latest`.
      - name: Compute the image tags
        id: tags
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag_name }}
        run: |
          tags="$IMAGE:$TAG"
          case "$TAG" in
            *-*) echo "prerelease — 'latest' stays where it is" ;;
            *)   tags="$tags,$IMAGE:latest" ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      # Multi-arch from the repository's own Dockerfile — the same scratch
      # image compose builds locally, so the published image and the locally
      # built one cannot drift. The VERSION build-arg stamps the binary's
      # `version` subcommand output with the release tag.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.prepare.outputs.tag_name }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
