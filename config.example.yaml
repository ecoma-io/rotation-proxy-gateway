# Runtime configuration for rotation-proxy-gateway.
# The process polls this file each second and hot-reloads validated changes
# when its content hash changes. Copy it to config.yaml, replace the example
# routes, then start the service. config.yaml is intentionally ignored because
# it normally contains credentials.
#
# `kind` is the public egress IP family guaranteed by the proxy provider. It
# does not describe the SOCKS endpoint address family or restrict targets. A
# v4-only or v6-only route list is valid; the other dedicated listener replies
# with the ordinary no-route SOCKS general failure (05 01) until matching
# routes are added.
#
# The inbound listeners speak SOCKS5 (RFC 1928). There is no `global:` block:
# the removed HTTP era's `target-tls-insecure` and `max-body-buffer` keys are
# rejected, so the last-known-good config keeps serving and first boot refuses
# to start if present.

# Application log threshold: debug, info, warn, or error.
log-level: info

# Total distinct eligible routes attempted after endpoint TCP-dial or SOCKS
# authentication failures.
max-retries: 3

cooldown:
  # First SOCKS endpoint TCP-dial failure cooldown; it doubles per consecutive
  # dial failure, capped by max.
  base: 15s
  # Upper bound for exponential endpoint TCP-dial cooldowns.
  max: 10m

# Timeout covering SOCKS endpoint TCP dialing and SOCKS setup.
dial-timeout: 10s

# Optional background pool of half-established upstream connections: TCP +
# SOCKS greeting + auth, no CONNECT — parked connections are never
# target-specific. A request that selects a route borrows one instead of
# redoing the greeting round trip; a miss falls through to the ordinary cold
# dial, so requests never wait. The pool never touches route health, and a
# rotation closes the old generation of parked connections. It pays where
# upstream round trips are real (see e2e/BENCH.md); off by default. Every
# value below is also the default.
warm-pool:
  enabled: false
  # Parked connections per route: keep at least min idle, at most max.
  min-idle-per-proxy: 1
  max-idle-per-proxy: 2
  # Process-wide ceiling on idle parked connections across all routes.
  max-total-idle: 64
  # Concurrent background dials replenishing the pool, process-wide.
  max-replenish-concurrency: 2
  # Cap on replenish dials in flight toward ONE route (0 = uncapped). Set it
  # when the pool mixes providers and one tolerates fewer concurrent
  # handshakes than the fleet cap: a provider with R routes sees at most
  # R × this many concurrent warm dials.
  # max-replenish-per-route: 1
  # A parked connection nobody borrowed is closed after this long.
  idle-ttl: 45s

# Manual-route rotation knobs. Every value below is also the default.
rotation:
  # How many rotations may run at once: a fixed count (1) or a percent of the
  # manual pool ("25%", rounds up, minimum 1, never above the pool size).
  # Rotating takes a route offline briefly, so this bounds how much of the
  # pool can be unavailable at the same moment.
  max-concurrent: 1
  # How long to wait for a rotating route's in-flight requests and tunnels to
  # finish before rotating anyway. Independent of the RPGW_SHUTDOWN_GRACE
  # environment variable.
  drain-timeout: 55s
  # Rotate every manual route once at process start (max-concurrent still
  # applies). Off by default: startup only probes and records the current
  # egress IP of each manual route.
  rotate-on-start: false
  # IP verification. A rotation counts as successful only when the egress IP
  # observed through this endpoint actually changed. Must be https; the
  # response is parsed as key=value lines containing an ip= entry.
  ip-check-url: https://www.cloudflare.com/cdn-cgi/trace
  # Total window to observe the changed IP after calling the rotate API...
  ip-check-timeout: 20s
  # ...probing at this cadence.
  ip-check-interval: 2s
  # Ceiling for the retry backoff after a rotation that did not change the
  # egress IP. Retries never stop; they only slow down to this limit.
  retry-backoff-max: 15m

proxies:
  # Static SOCKS5 routes selected by the local health-aware pool. The route
  # line carries no scheme — the endpoint protocol is always SOCKS5 — so the
  # accepted forms are host:port, user:pass@host:port, and
  # host:port:user:pass. A line containing socks5:// or any other scheme is
  # rejected. Bracket IPv6 literals.
  #
  # `id` is the optional operator-facing route label that routing rules refer
  # to (see the routing block below). Ids must be unique across auto and
  # manual routes, and every route must carry one when a routing block is
  # present. Renaming an id changes routing only — the route's health state
  # is keyed by its URL+kind+origin and survives the rename.
  auto:
    - id: egress-a
      proxy: username:password@v4-provider.example:1080
      kind: v4
    - id: egress-b
      proxy: username:password@[2001:db8::1]:1080
      kind: v6

  # API-rotated routes. The provider swaps the route's public egress IP when
  # the rotate API is called; the gateway drives that call every
  # rotate-interval, drains the route first, and verifies the IP actually
  # changed afterwards.
  manual:
    - id: rotating-a
      proxy: username:password@v6-provider.example:1080
      kind: v6
      # Minimum time between two rotations of this route. It is also the
      # first backoff step when a rotation did not change the IP.
      rotate-interval: 90s
      # The provider call that performs the rotation. headers and body may
      # carry provider credentials: they are never logged and never appear
      # in errors or /status.
      api:
        url: http://provider.example/api/rotate-ip
        method: POST
        headers:
          Content-Type: application/json
        body: |
          {
            "proxy_id": 1,
            "token": "xxxx"
          }
        timeout: 10s

# Optional domain-based request routing. Absent (the default), every listener
# selects from the whole pool exactly as before the block existed. Present, it
# narrows which routes each target may use — first matching rule wins, and an
# unmatched target resolves to default-routes (or to no route at all, receiving
# the ordinary 05 01 general failure). It never overrides health: the pool
# still decides which candidate is picked, still cools and auth-blocks, and
# still round-robins inside the candidate set.
#
# Only CONNECT targets sent as domain names (ATYP=0x03) can match a rule; IP
# targets always resolve to the default set. Names compare case-insensitively
# with one trailing DNS dot ignored. `*.openai.com` matches api.openai.com and
# a.b.openai.com — never openai.com itself and never evilopenai.com — and the
# only wildcard form is a leading `*.`.
#
# Every rule needs at least one domain and one route; every listed id must
# name a configured route; every serving route must carry an id once this
# block exists. Omit default-routes entirely when unmatched targets should
# fail closed (an explicit empty list is rejected).
# routing:
#   rules:
#     - match:
#         domains:
#           - api.openai.com
#           - "*.openai.com"
#       routes:
#         - egress-a
#         - rotating-a
#   default-routes:
#     - egress-b
