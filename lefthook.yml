# A hook slow enough to notice is a hook contributors learn to skip with
# --no-verify — so this file formats what is staged and nothing more; the
# heavier gates (vet, lint, race, E2E) live in CI where they run the same way
# for every contributor.
pre-commit:
  parallel: false
  commands:
    gofmt:
      glob: "*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true
    format:
      glob: "*.{md,yml,yaml,json,json5,mjs}"
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
pre-push:
  commands:
    test:
      # The e2e package needs more than Go's default 600s per-package timeout —
      # it drives the real binary through the whole suite. CI runs it the same
      # way, with the same 25m budget, so a push is gated by exactly what CI
      # will run rather than by a stricter local accident.
      run: go test -timeout 25m ./...
